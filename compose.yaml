services:

  linkaudit-service:
    build:
      context: .
      dockerfile: linkaudit/service/Dockerfile
    ports:
      - "9091:9091"

  auth-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: auth/service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/authdb
      SPRING_DATASOURCE_USERNAME: auth
      SPRING_DATASOURCE_PASSWORD: auth
    ports:
      - "9092:9092"
    depends_on:
      auth-postgres:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: user/service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9093:9093"
    depends_on:
      - auth-service

  shortener-service:
    build:
      context: .
      dockerfile: shortener/service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/shortenerdb
      SPRING_DATASOURCE_USERNAME: auth
      SPRING_DATASOURCE_PASSWORD: auth
    ports:
      - "9090:9090"
    depends_on:
      linkaudit-service:
        condition: service_started
      auth-service:
        condition: service_started
      auth-postgres:
        condition: service_healthy
