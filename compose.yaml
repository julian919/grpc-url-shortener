services:

  # Single HTTP entry point for browsers. Transcodes JSON <-> gRPC using the
  # combined descriptor built from the shortener/auth/user protos -- see
  # edge/descriptor and edge/envoy.yaml. The gRPC ports below stay published so
  # grpcurl/Postman reflection still works against the services directly; the
  # edge is additive, not a gate. linkaudit has no browser-facing rpc so it is
  # not behind the edge.
  edge:
    build:
      context: .
      dockerfile: edge/Dockerfile
    ports:
      - "8080:8080"   # the one URL the frontend needs
      - "9901:9901"   # envoy admin: /config_dump, /stats, /ready
    depends_on:
      - shortener-service
      - auth-service
      - user-service

  linkaudit-service:
    build:
      context: .
      dockerfile: linkaudit/service/Dockerfile
    ports:
      - "9091:9091"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    volumes:
      # Named, not anonymous: an anonymous volume is tied to one container and
      # gets silently orphaned by anything that recreates the container under
      # a new identity (a service rename is exactly what did this on
      # 2026-09-10 -- the old data was still on disk, just disconnected). A
      # named volume is addressed by this name regardless of container
      # churn, and `docker compose down` (without -v) never removes it.
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      default:
        aliases:
          - auth-postgres

  auth-service:
    build:
      context: .
      dockerfile: auth/service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authdb
      SPRING_DATASOURCE_USERNAME: auth
      SPRING_DATASOURCE_PASSWORD: auth
    ports:
      - "9092:9092"
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: user/service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9093:9093"
    depends_on:
      - auth-service

  shortener-service:
    build:
      context: .
      dockerfile: shortener/service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shortenerdb
      SPRING_DATASOURCE_USERNAME: auth
      SPRING_DATASOURCE_PASSWORD: auth
    ports:
      - "9090:9090"
    depends_on:
      linkaudit-service:
        condition: service_started
      auth-service:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  pgdata:
