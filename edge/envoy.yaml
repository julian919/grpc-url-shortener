# The edge proxy. One HTTP port (8080) for the whole system; every service
# behind it stays pure gRPC and is never reached directly by a browser.
#
# There is no route table listing /api/login, /api/links, etc., and no handler
# code. Envoy learns the entire HTTP surface by reading api-bundle.pb -- the
# compiled FileDescriptorSet built from the .proto files in edge/descriptor,
# carrying the google.api.http option declared on each browser-facing rpc.
# Change a proto, rebuild the bundle, rebuild this image: the surface follows.

static_resources:

  listeners:
    - name: edge_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: edge
                codec_type: AUTO

                route_config:
                  name: edge_routes
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      # The transcoder rewrites :path to the gRPC form
                      # (/auth.api.AuthService/Login) BEFORE routing and clears
                      # the route cache, so these match on the proto
                      # package+service, not on the HTTP path the browser sent.
                      # One entry per browser-facing service.
                      routes:
                        - match: { prefix: "/shortener.api.ShortenerService/" }
                          route: { cluster: shortener_grpc, timeout: 15s }
                        - match: { prefix: "/auth.api.AuthService/" }
                          route: { cluster: auth_grpc, timeout: 15s }
                          # RFC 6749 section 5.1: a response carrying tokens or
                          # credentials MUST send Cache-Control: no-store and
                          # Pragma: no-cache. Every HTTP response from AuthService
                          # is login, refresh, or client-token material (or an
                          # error about it), so the whole route gets it. auth-service
                          # speaks gRPC and has no say over HTTP caching headers,
                          # so the edge is the right place.
                          response_headers_to_add:
                            - header: { key: "Cache-Control", value: "no-store" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            - header: { key: "Pragma", value: "no-cache" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - match: { prefix: "/user.api.UserService/" }
                          route: { cluster: user_grpc, timeout: 15s }

                http_filters:
                  - name: envoy.filters.http.grpc_json_transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                      proto_descriptor: /etc/envoy/api-bundle.pb
                      # An rpc is exposed over HTTP only if BOTH its service is
                      # listed here AND it carries a google.api.http option.
                      # auto_mapping stays off, so GetClientToken and
                      # CreatePrincipal (no option) remain gRPC-only.
                      services:
                        - shortener.api.ShortenerService
                        - auth.api.AuthService
                        - user.api.UserService
                      # gRPC status -> real HTTP status + JSON body, instead of
                      # 200 with grpc-status in a trailer. NOT_FOUND -> 404,
                      # INVALID_ARGUMENT -> 400, UNAUTHENTICATED -> 401,
                      # PERMISSION_DENIED -> 403.
                      convert_grpc_status: true
                      print_options:
                        # Keep zero values (unset enum, page: 0) in the JSON;
                        # proto3 would otherwise drop them and confuse a client.
                        always_print_primitive_fields: true

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # gRPC is HTTP/2 only. Without http2_protocol_options Envoy speaks HTTP/1.1
    # upstream and every call fails -- the same trap lesson 6 covers for L4
    # load balancers.
    - name: shortener_grpc
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: shortener_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: shortener-service, port_value: 9090 }

    - name: auth_grpc
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: auth_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: auth-service, port_value: 9092 }

    - name: user_grpc
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: user_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: user-service, port_value: 9093 }

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
