syntax = "proto3";

// Package matches the directory path: shortener/api -> shortener.api.
// Same convention as the Cognixus monorepo (cms/api -> cms.api).
//
// No version segment, deliberately. Versioning in the package (shortener.api.v1)
// is a Buf/Google-API house rule, not a protobuf one -- the official style guide
// does not mention it. When a genuinely breaking change is needed, the move is to
// publish a parallel shortener.api.v2 package and migrate callers across, rather
// than editing this one in place.
package shortener.api;

// The required-permission option applied to CreateShortLink below, further
// down this file, comes from here -- see auth/api/auth_api.proto for why it's
// a MethodOptions extension rather than a Java-side config check.
import "auth/api/auth_api.proto";

option java_multiple_files = true;
option java_package = "com.example.shortener.api";
option java_outer_classname = "ShortenerProto";

// ---------------------------------------------------------------------------
// LinkStatus is THE shared type of this project.
//
// Both shortener-service and link-audit-service are generated from this one
// enum. That is the entire point: in a previous project this enum was
// hand-copied into a second service and the two definitions drifted apart.
// Here, adding a value is a single edit to a single file.
//
// Rules being obeyed (see lessons/0001):
//   - a zero value MUST exist, because proto3 cannot distinguish "unset"
//     from "the first value"
//   - the zero value means UNSPECIFIED, never a real state, so a field
//     nobody set fails closed instead of silently meaning ACTIVE
// ---------------------------------------------------------------------------
enum LinkStatus {
  LINK_STATUS_UNSPECIFIED = 0;
  LINK_STATUS_ACTIVE      = 1;
  LINK_STATUS_EXPIRED     = 2;
  LINK_STATUS_FLAGGED     = 3;
}

message ShortLink {
  // Nothing retired yet. When a field is deleted, its number and name are
  // reserved HERE, in the same commit. See reference/proto-compatibility.html
  // reserved 9 to 11;
  // reserved "click_count";

  string     short_code = 1;
  string     long_url   = 2;
  int64      created_at = 3;  // epoch millis
  LinkStatus status     = 4;
}

// Request and response are always their own message type, even when they wrap
// a single string. A bare scalar has nowhere to grow.
message CreateShortLinkRequest {
  string long_url = 1;
}

// Previously a `oneof { ShortLink link; Error error; }`, treating a rejected
// URL as a normal successful response. Reverted: gRPC's own Status codes are
// the more standard place for this (INVALID_ARGUMENT, FAILED_PRECONDITION),
// same convention as ResolveShortLink's NOT_FOUND below -- see
// lessons/0004-rpc-kinds-deadlines-status-codes.html for why this changed
// after it was already built and working.
message CreateShortLinkResponse {
  ShortLink link = 1;
}

message ResolveShortLinkRequest {
  string short_code = 1;
}

message ResolveShortLinkResponse {
  ShortLink link = 1;
}

message RetrieveShortLinksRequest {
  int32 page      = 1;
  int32 page_size = 2;
}

message PageInfo {
  int32 page        = 1;
  int32 page_size   = 2;
  int32 total_count = 3;
  int32 total_pages = 4;
}

message RetrieveShortLinksResponse {
  repeated ShortLink links     = 1;
  PageInfo           page_info = 2;
}

service ShortenerService {
  // Write path. Low QPS. Requires CREATE_SHORT_URL -- the requirement lives
  // here, on the contract, not in shortener-service's own Java config. Any
  // caller (or future language's client) can read this straight off the
  // .proto, before ever touching shortener-service's source.
  rpc CreateShortLink(CreateShortLinkRequest) returns (CreateShortLinkResponse) {
    option (auth.api.requires_permissions).permissions = "CREATE_SHORT_URL";
  }

  // Read path. This is the RPC that gets scaled to N replicas in lesson 6,
  // and the one ghz hammers in lesson 7. No permission required -- public.
  rpc ResolveShortLink(ResolveShortLinkRequest) returns (ResolveShortLinkResponse);

  rpc RetrieveShortLinks(RetrieveShortLinksRequest) returns (RetrieveShortLinksResponse){
    option (auth.api.requires_permissions).permissions = "LIST_SHORT_URL";
  };
}
