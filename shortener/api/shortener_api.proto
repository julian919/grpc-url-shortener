syntax = "proto3";

// Package matches the directory path: shortener/api -> shortener.api.
// Same convention as the Cognixus monorepo (cms/api -> cms.api).
//
// No version segment, deliberately. Versioning in the package (shortener.api.v1)
// is a Buf/Google-API house rule, not a protobuf one -- the official style guide
// does not mention it. When a genuinely breaking change is needed, the move is to
// publish a parallel shortener.api.v2 package and migrate callers across, rather
// than editing this one in place.
package shortener.api;

// The required-permission option applied to CreateShortLink below, further
// down this file, comes from here -- see auth/api/auth_api.proto for why it's
// a MethodOptions extension rather than a Java-side config check.
import "auth/api/auth_api.proto";

// google.api.http is the SAME kind of thing as requires_permissions above: a
// MethodOptions extension, declared on the contract rather than configured in
// some service's own source. It maps each rpc onto an HTTP verb + path, which
// is what lets the edge proxy expose these rpcs as JSON over HTTP without a
// line of hand-written routing code anywhere. Vendored under google/api/ --
// same treatment google/protobuf/descriptor.proto already gets.
import "google/api/annotations.proto";


option java_multiple_files = true;
option java_package = "com.example.shortener.api";
option java_outer_classname = "ShortenerProto";

// ---------------------------------------------------------------------------
// LinkStatus is THE shared type of this project.
//
// Every consumer is generated from this one enum -- shortener-service in Java,
// the webapp in TypeScript via protobuf-es. That is the entire point: in a
// previous project this enum was hand-copied into a second service and the two
// definitions drifted apart. Here, adding a value is a single edit to a single
// file, picked up by both toolchains on the next build.
//
// Rules being obeyed (see lessons/0001):
//   - a zero value MUST exist, because proto3 cannot distinguish "unset"
//     from "the first value"
//   - the zero value means UNSPECIFIED, never a real state, so a field
//     nobody set fails closed instead of silently meaning ACTIVE
// ---------------------------------------------------------------------------
enum LinkStatus {
  LINK_STATUS_UNSPECIFIED = 0;
  LINK_STATUS_ACTIVE      = 1;
  LINK_STATUS_EXPIRED     = 2;
  LINK_STATUS_FLAGGED     = 3;
}

message ShortLink {
  // Nothing retired yet. When a field is deleted, its number and name are
  // reserved HERE, in the same commit. See reference/proto-compatibility.html
  // reserved 9 to 11;
  // reserved "click_count";

  string     short_code = 1;
  string     long_url   = 2;
  int64      created_at = 3;  // epoch millis
  LinkStatus status     = 4;

  // Output only: set by the server on every mutation, ignored if a client sends
  // it. AIP-148 would call this update_time and type it google.protobuf.Timestamp;
  // it is int64 epoch millis here to match created_at above, since having two
  // timestamp representations in one message is worse than not matching the AIP.
  int64      updated_at = 5;
}

// Request and response are always their own message type, even when they wrap
// a single string. A bare scalar has nowhere to grow.
message CreateShortLinkRequest {
  string long_url = 1;
}

// Previously a `oneof { ShortLink link; Error error; }`, treating a rejected
// URL as a normal successful response. Reverted: gRPC's own Status codes are
// the more standard place for this (INVALID_ARGUMENT, FAILED_PRECONDITION),
// same convention as GetShortLink's NOT_FOUND below -- see
// lessons/0004-rpc-kinds-deadlines-status-codes.html for why this changed
// after it was already built and working.
message CreateShortLinkResponse {
  ShortLink short_link = 1;
}

message GetShortLinkRequest {
  string short_code = 1;
}

message GetShortLinkResponse {
  ShortLink short_link = 1;
}

message ListShortLinksRequest {
  int32 page      = 1;
  int32 page_size = 2;
}

message PageInfo {
  int32 page        = 1;
  int32 page_size   = 2;
  int32 total_count = 3;
  int32 total_pages = 4;
}

message ListShortLinksResponse {
  // Named for the resource type in snake_case, per AIP-122: "the field name should be
  // equivalent to the corresponding message's name in snake case". Every ShortLink-typed
  // field in this file follows that, so there is one name to remember rather than two.
  repeated ShortLink short_links = 1;
  PageInfo           page_info   = 2;
}

// Partial update via proto3 EXPLICIT PRESENCE, not a google.protobuf.FieldMask.
//
// The problem both solve is the same: proto3 cannot tell "the client omitted
// this" from "the client sent the zero value", so a server copying every field
// of the request would blank out whatever the caller left unset. `optional`
// answers it per field -- hasLongUrl() is true only if the client actually sent
// long_url -- which is all this message needs.
//
// A FieldMask earns its keep on large resources with many clients, where you
// want one generic Update instead of dozens of narrow rpcs, and where the mask
// can name NESTED paths ("author.address.city") that `optional` cannot express.
// ShortLink has two mutable fields. Same posture as Cognixus, which has no
// FieldMask anywhere and uses `optional` plus purpose-specific Update rpcs.
message UpdateShortLinkRequest {
  string              short_code = 1;
  optional string     long_url   = 2;
  optional LinkStatus status     = 3;
}

message UpdateShortLinkResponse {
  ShortLink short_link = 1;
}

service ShortenerService {
  // Write path. Low QPS. Requires CREATE_SHORT_URL -- the requirement lives
  // here, on the contract, not in shortener-service's own Java config. Any
  // caller (or future language's client) can read this straight off the
  // .proto, before ever touching shortener-service's source.
  rpc CreateShortLink(CreateShortLinkRequest) returns (CreateShortLinkResponse) {
    option (auth.api.requires_permissions).permissions = "CREATE_SHORT_URL";

    // body: "*" means the whole JSON object maps onto the request message, so
    // {"long_url": "..."} becomes CreateShortLinkRequest{long_url}. The
    // Authorization header rides through untouched as gRPC metadata, which is
    // what keeps the CREATE_SHORT_URL check above working over HTTP too.
    option (google.api.http) = {
      post: "/api/links"
      body: "*"
    };
  }

  // Read path. This is the RPC that gets scaled to N replicas in lesson 6,
  // and the one ghz hammers in lesson 7. No permission required -- public.
  rpc GetShortLink(GetShortLinkRequest) returns (GetShortLinkResponse) {
    // {short_code} binds the path segment onto the field of the same name.
    option (google.api.http) = {
      get: "/api/links/{short_code}"
    };
  }

  rpc ListShortLinks(ListShortLinksRequest) returns (ListShortLinksResponse){
    option (auth.api.requires_permissions).permissions = "LIST_SHORT_URL";

    // No body and no path params, so every remaining field of the request
    // message is read from the query string: /api/links?page=2&page_size=50
    option (google.api.http) = {
      get: "/api/links"
    };
  };

  // PATCH, not PUT: this is a partial update, and PUT means "replace the whole
  // resource". AIP-134 mandates PATCH for the standard Update method.
  rpc UpdateShortLink(UpdateShortLinkRequest) returns (UpdateShortLinkResponse) {
    option (auth.api.requires_permissions).permissions = "UPDATE_SHORT_URL";

    // Same shape as GetShortLink: {short_code} binds the path segment onto the
    // field of the same name. body: "*" maps the JSON onto every field NOT
    // already bound by the path -- so short_code comes from the URL and must
    // NOT be repeated in the body. Omit a field to leave it alone.
    //   PATCH /api/links/abc123
    //   {"longUrl": "https://example.com", "status": "LINK_STATUS_EXPIRED"}
    //
    // A short_code sent in the body is silently ignored, and the service cannot
    // detect it: the transcoder has already filled the field from the path, so
    // there is nothing left to compare against. PATCH /api/links/A with
    // {"shortCode": "B"} updates A and returns 200. Verified against the edge.
    option (google.api.http) = {
      patch: "/api/links/{short_code}"
      body: "*"
    };
  }
}
