# Activated in containers via SPRING_PROFILES_ACTIVE=docker (see compose.yaml).
#
# This used to also repoint the link-audit gRPC channel from localhost:9091 to the Compose
# service name; that channel is gone along with linkaudit-service, so the datasource host is
# all that differs in a container now.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/shortenerdb}
