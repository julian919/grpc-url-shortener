spring:
  application:
    name: shortener-service
  grpc:
    server:
      port: 9090
    client:
      channel:
        # auth: to fetch shortener's own service token (auth-client's auto-configuration).
        # user: the service it calls, carrying that token.
        auth:
          target: "static://localhost:9092"
        user:
          target: "static://localhost:9093"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shortenerdb}
    username: ${SPRING_DATASOURCE_USERNAME:auth}
    password: ${SPRING_DATASOURCE_PASSWORD:auth}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # No JWKS-over-HTTP -- auth-service has no HTTP port at all in this design. The
          # public key is a bundled copy of auth-service's own certs/public.pem.
          public-key-location: classpath:auth-public-key.pem
          # ShortenerExceptionAdvice's translation is exceptions -> Status. This is the
          # equivalent for JWT claims -> Spring Security GrantedAuthority: read the
          # "permissions" claim directly, no "SCOPE_" prefix, matching what
          # ProtoPermissionAuthorizationManager compares against.
          authorities-claim-name: permissions
          authority-prefix: ""

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Credential shortener presents to auth-service to obtain its own service token. No default:
# an environment that forgot it should fail at startup, not at the first write.
app:
  auth-client:
    client-id: shortener-service
    client-secret: ${SHORTENER_SERVICE_AUTH_SECRET}
