spring:
  application:
    name: shortener-service
  grpc:
    server:
      port: 9090
    client:
      channel:
        # Key restructured in Spring gRPC 1.1: was spring.grpc.client.channels.<n>.address
        link-audit:
          target: "static://localhost:9091"

management:
  endpoints:
    web:
      exposure:
        include: health,info
