spring:
  application:
    name: user-service
  grpc:
    server:
      port: 9093
    client:
      channel:
        auth:
          target: "static://localhost:9092"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/userdb}
    username: ${SPRING_DATASOURCE_USERNAME:auth}
    password: ${SPRING_DATASOURCE_PASSWORD:auth}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Bundled copy of auth-service's certs/public.pem -- no JWKS-over-HTTP, since
          # auth-service has no HTTP port in this design. Same arrangement shortener uses.
          public-key-location: classpath:auth-public-key.pem
          authorities-claim-name: permissions
          authority-prefix: ""

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  auth-client:
    # No default on purpose: this must be the same secret that was registered for this client-id
    # in auth-service's database, and an environment that forgot to set the env var should fail to
    # start rather than fail later with "Invalid client credentials". Dev values come from
    # compose.yaml and match auth's db/dev/R__init_auth.sql; other environments register the client
    # out of band -- see auth/service/src/main/resources/db/README.md.
    client-id: user-service
    client-secret: ${USER_SERVICE_AUTH_SECRET}
