syntax = "proto3";

package auth.api;

import "google/protobuf/descriptor.proto";

option java_multiple_files = true;
option java_package = "com.example.auth.api";
option java_outer_classname = "AuthProto";

// ---------------------------------------------------------------------------
// A required permission, declared ON THE RPC ITSELF, not in a consuming
// service's Java config. Modeled directly on a real pattern (Cognixus's
// auth/api/auth_api.proto: RequiresPermissions + `extend MethodOptions`),
// trimmed to just permissions -- no roles, no AND/OR logic operator, since
// nothing here needs more than "the caller has this one permission".
//
// Field number 536870910 is in protobuf's reserved-for-internal-use custom
// option range (500000000-536870911) -- the same range Cognixus's own
// extension uses, chosen so it can never collide with a numbered field
// anyone adds to a normal message.
// ---------------------------------------------------------------------------
message RequiresPermissions {
  repeated string permissions = 1;
}

extend google.protobuf.MethodOptions {
  RequiresPermissions requires_permissions = 536870910;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  int64  expires_in_seconds = 2;
  string refresh_token = 3;
}

// ---------------------------------------------------------------------------
// Standard OAuth2 Token bundle, modeled after Cognixus OAuth2Token.
// Returned by GetClientToken and RenewToken.
// ---------------------------------------------------------------------------
message OAuth2Token {
  string access_token        = 1;
  string token_type          = 2; // "bearer"
  int64  expires_in_seconds  = 3;
  string refresh_token       = 4; // present for user refreshable sessions
}

// Internal surface, called by user-service only when creating a new account.
// Requires CREATE_PRINCIPAL -- see GetClientToken below for how a service
// gets a token carrying it.
message CreatePrincipalRequest {
  string email = 1;
  string password = 2; // plaintext; auth-service hashes it, never stores it as-is
}

message CreatePrincipalResponse {
  string principal_id = 1; // UUID, as a string
}


// Request for GetClientToken.
// Modeled after Cognixus: client_id and client_secret can either be passed
// here in the request body, OR supplied via gRPC metadata header:
// "Authorization: Basic <base64(client_id:client_secret)>".
message GetClientTokenRequest {
  string client_id     = 1;
  string client_secret = 2;
}

// Request to renew an access token using a long-lived refresh token.
message RenewTokenRequest {
  string refresh_token = 1;
}

// Response from RenewToken containing the new access token and rotated refresh token.
message RenewTokenResponse {
  OAuth2Token token = 1;
}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);

  // Modern Cognixus-style client token issuance
  rpc GetClientToken(GetClientTokenRequest) returns (OAuth2Token);

  // OAuth 2.1 refresh token rotation
  rpc RenewToken(RenewTokenRequest) returns (RenewTokenResponse);

  rpc CreatePrincipal(CreatePrincipalRequest) returns (CreatePrincipalResponse) {
    option (auth.api.requires_permissions).permissions = "CREATE_PRINCIPAL";
  }
}
