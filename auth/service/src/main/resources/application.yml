spring:
  application:
    name: auth-service
  grpc:
    server:
      port: 9092
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${SPRING_DATASOURCE_USERNAME:auth}
    password: ${SPRING_DATASOURCE_PASSWORD:auth}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    # Schema only. Stated explicitly rather than left to the default so that the prod-safe set is
    # the thing written down: the dev seed lives in classpath:db/dev and is added ONLY by the
    # "dev" profile (application-dev.yml). An environment that does not activate that profile
    # cannot run it, which is the point -- see db/dev/R__init_auth.sql.
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          authorities-claim-name: permissions
          authority-prefix: ""

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    issuer-uri: ${JWT_ISSUER_URI:https://auth-service}
    private-key: classpath:certs/private.pem
    public-key: classpath:certs/public.pem
    access-token-ttl: 15m
    refresh-token-ttl: 168h
