spring:
  application:
    name: auth-service
  grpc:
    server:
      port: 9092
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${SPRING_DATASOURCE_USERNAME:auth}
    password: ${SPRING_DATASOURCE_PASSWORD:auth}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # Doesn't need to resolve to anything real -- no JWKS-over-HTTP in this design
    # (auth-service has no HTTP port at all; shortener-service gets the public key as a
    # bundled classpath resource instead). Still needs to be a syntactically valid URI,
    # though: Spring Security's Jwt.getIssuer() parses the `iss` claim as a java.net.URL
    # and throws if it can't -- a bare hostname-like string like "auth-service" fails
    # that even though raw JWT itself doesn't require `iss` to be a URI at all.
    issuer-uri: ${JWT_ISSUER_URI:https://auth-service}
    private-key: classpath:certs/private.pem
    public-key: classpath:certs/public.pem
    access-token-ttl: 15m
